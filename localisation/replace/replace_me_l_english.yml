 RISE_OF_THE_OTTOMANS:0 "The End of the Middle Ages"
 RISE_OF_THE_OTTOMANS_DESC:0 "Europe towards the end of the Middle Ages was a fighting ground on all sides. On the west, the English and the French are preparing to fight over the fort of Maine, while the Castillians are preparing to attack the Granadans. On the east, Muscovy and Novgorod are fighting to unite Russia and Poland is preparing to attack the Crusader States in the Baltic. On the north, the Kalmar Union is facing instability, as Sweden is preparing to revolt against the Danish king. Finally on the south, Venice and Genoa are fighting for the control of the Mediterranean trade, rivaling Byzantium. In this Europe who will come on top and who will fall to their end?"
