l_english:
 flavor_epi.2.t:0 "Thessalonike reclaimed"
 flavor_nic.2.d:0 "Recently we have recaptured the imperial co-capital of Thessalonica. Some of our advisors consider it a great opportunity to move our capital there, as it'll be closer to our original capital of Constantinople. However, there is still the choice not to do it, as our current capital is closer to the west"
 flavor_epi.2.a:0 "Proclaim the empire of Thessalonica"
 flavor_epi.2.b:0 "Change nothing"
