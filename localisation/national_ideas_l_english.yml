#Great Britain 
gwy_ideas:0 "Gwyneddian ideas"
gwy_ideas_start:0 "Gwyneddian traditions"
gwy_ideas_bonus:0 "Gwyneddian ambitions"
gwy_ideas_historia_brittonum:0 "Historia Brittonum"
gwy_ideas_historia_brittonum_desc:0 "By the ninth century, Gwyneddian scholars published the Historia Brittonum, a magnificent book recording britain's history from the mythical Brutus until the princes of Wales. A text that legitimizes our authority."
gwy_ideas_first_princes_of_wales:0 "First Princes of Wales"
gwy_ideas_first_princes_of_wales_desc:0 "Before being no more but a title, the prince of Wales meant prestige and superiority over welsh petty kings as well as over the kings of England."
gwy_ideas_last_realm_standing:0 "Last Realm Standing"
gwy_ideas_last_realm_standing_desc:0 "While those southerners were defeated one by one by the dishonourable march lords, our realm stood still and strong for decades."
gwy_ideas_ore_mines:0 "Ore mines"
gwy_ideas_ore_mines_desc:0 "Our land is not fertile. But it is rich in ressources. We shall use those ressources to defeat our stronger neighbour"
gwy_ideas_llanfairpwllgwyngyllgogerychwyrndrobwllllantysiliogogogoch:0 "Llanfairpwllgwyngyllgogerychwyrndrobwllllantysiliogogogoch"
gwy_ideas_llanfairpwllgwyngyllgogerychwyrndrobwllllantysiliogogogoch_desc:0 "Our people is smart enough to use the sophisticated language taht is welsh and create villages with over 50 letters."
gwy_ideas_eryri:0 "Eryri"
gwy_ideas_eryri_desc:0 "Those mountains are our strongest ally against any foreign invader. It makes us invincible."
gwy_ideas_defend_our_homeland:0  "Defend Our Homeland"
gwy_ideas_defend_our_homeland_desc:0 "We descend from the britons, who controlled that land for a thousand year. Anglo-saxons and Normands are simply foreign invaders and shall be defeated on the field."
