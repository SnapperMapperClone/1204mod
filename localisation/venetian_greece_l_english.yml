l_english:
 purchse_negroponte_title:0 "Purchase Negroponte"
 purchase_negroponte_desc:0 "In order to extend our influence in the Aegean, we need to acquire more land. The island of Negroponte seems like a good starting choice"
 ven_greece.1.t:0 "The Negroponte Purchase"
 ven_greece.1.d:0 "We have decided to purchase the island of Negroponte. We're making a deal to the holders of the island"
 ven_greece.1.a:0 "Let's see if they're interested"
 ven_greece.2.t:0 "A deal from Venice"
 ven_greece.2.d:0 "The Venetians are offering us money for the control of the island of Negroponte. While the island isn't useless to us, the money the Venetians give for it is good"
 ven_greece.2.a:0 "We accept the deal"
 ven_greece.2.b:0 "We reject the deal"
 ven_greece.3.t:0 "Deal accepted"
 ven_greece.3.d:0 "The crusaders have accepted our deal and now Negroponte is under our control"
 ven_greece.3.a:0 "Negroponte will make a fine addition to our collection"
 ven_greece.4.t:0 "Deal rejected"
 ven_greece.4.d:0 "The crusaders have decided to keep control of Negroponte"
 ven_greece.4.a:0 "Damn them!"