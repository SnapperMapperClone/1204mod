l_english:
 flavor_iberian.1.t:0 "Expulsion of the Arabs in $PROVINCENAME$"
 flavor_iberian.1.d:0 "With catholics becoming the majority in $PROVINCENAME$, the local Arabs are fearing for their lives and are fleeing the province"
 flavor_iberian.1.a:0 "Noone escapes the Spanish Inquisition!"
 flavor_iberian.2.t:0 "Assimilation of the Mozarabs in $PROVINCENAME$"
 flavor_iberian.2.d:0 "The Mozarabs were Latin speaking Christians in Iberia under the Arab rule. Now that they have come in contact with our people, they have started adopting elemets of our language onto theirs, slowly becoming more and more assimilated"
 flavor_iberian.2.a:0 "Excellent"
