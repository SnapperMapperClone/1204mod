###GREEK###
 cyrenaica_greek_title:0 "Settle Greeks in Cyrenaica"
 cyrenaica_greek_desc:0 "Cyrenaica was once a rich Greek and then Roman province. Now that it's under our control, we can bring back its greatness. We can start by making new greek settlements"
 characene_greek_title:0 "Re-establish Characene"
 characene_greek_desc:0 "Characene was the last remnant of the Seleucids in south Mesopotamia. Although the people of the kingdom weren't greeks in their majority, the Greek language was important from its establishment to its fall. If we settle our people there, we can bring back its greatness"
 assimilate_the_georgians_title:0 "Assimilate the Georgians"
 assimilate_the_georgians_desc:0 "For centuries now, our people and the people of the land of Georgia have been interacting, the land even being under our influence for hundreads of years at one point. It is time to fully assimilate them into the glory of Rome"
 unite_the_romans_title:0 "Unite the romans"
 unite_the_romans_desc:0 "The Roman peope have been seperated for too long. It is time for us to unite them under one flag"

##SPANISH###
 assimilate_the_catalans_title:0 "Assimilate the Septimanians"
 assimilate_the_catalans_desc:0 "The Septimanians have helped us in reclaiming Iberia, and now it's their time to become like us"
