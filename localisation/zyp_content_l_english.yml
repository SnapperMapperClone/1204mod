 mongol_empire.1.t: "Fate of the Kurultai"
 mongol_empire.1.d: "With the Empire in existence for something to the effect of a half-milennium, but more importantly the institutions of political reform, it's time to consider reviewing the nature of the nobility and Kurultais in the Mongolian statehood. We will have to consider whether we should continue governing with the Kurultai in an expanded, long-form iteration or instead pivot to rule by decree."
 mongol_empire.1.a: "The Kurultai is an invaluable asset to the Empire."
