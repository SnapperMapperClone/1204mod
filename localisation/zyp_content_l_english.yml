 inheritance_reform_event.1.t: "Ineligible Heir"
 inheritance_reform_event.1.d: "[Root.Heir.GetName] has been considered ineligible for the succession on account of her sex. Our government's view on inheritance disallows female inheritance of the land. We could keep her anyway but at great cost."
 inheritance_reform_event.1.a: "Disinherit her."
 inheritance_reform_event.1.b: "Keep [Root.Heir.GetName]."
 
 inheritance_reform_event.2.t: "New Heir"
 inheritance_reform_event.2.d: "We currently have a female heir, but our law for succession details preference for male heirs should our ruler have one. It's time to choose."
 inheritance_reform_event.2.a: "Accept the new heir."
 inheritance_reform_event.2.b: "Keep our current heir."
 
 
 
 agriculture_ideas: "Agriculture Ideas"
 manor_houses: "Manor Houses"
 manor_houses_desc: "These are residences of the Lords of the Manor. They carry out duties of local administration, freeing the state administration to handle other affairs instead."
 cover_crops: "Cover Crops"
 cover_crops_desc: "Cover Crops themselves are not meant to be harvested but make the soil they're planted in ideal for growing food items quicker than would otherwise be possible."
 enclosures: "Enclosures"
 enclosures_desc: "While these restricted the commoners of land rights, the lords that now own the land in question can reorganize it more effectively."
 horseshoe_growth: "Horseshoe Growth"
 horseshoe_growth_desc: "Hooves on their own have a limited lifespan so it's best to shield them. The larger the horseshoe is, the more it protects the horse's feet, allowing it to manage its duties as movers of trade items."
 labor_abundance: "Labor Abundance"
 labor_abundance_desc: "The Late Middle Ages saw the gradual ballooning of population to an immense scale. It's only natural that these people be placed in charge of the various responsibilities that facilitate even further growth."
 open_field_system: "Open-Field System"
 open_field_system_desc: "Land is generally not owned in the feudal system - rather it is most often leased to a lord from the highest authority in the land. They may in turn grant serfs permission, temporarily at least, to own and operate (a field) to manage growth of crops."
 leasehold_tenancy: "Leasehold Tenancy"
 leasehold_tenancy_desc: "A leasehold tenancy is a property interest that gives a tenant the right to use a property for a set period of time."
 urban_ideas: "Urban Ideas"
 floating_crane: "Floating Crane"
 floating_crane_desc: "These don't literally float but they are quite useful for lifting materials to higher elevations so as to build taller structures."
 metalworking_infrastructure: "Metalworking Infrastructure"
 metalworking_infrastructure_desc: "Furnaces and stuff of the like were not a particularly common sight in history though now the technology for metallurgy has made significant inroads."
 paper_mill: "Paper Mill"
 paper_mill_desc: "Paper milling was not known to Europe until around the fifteenth or sixteenth centuries but was a technology available in the Arabic and Chinese worlds earlier. Now though we are capable of creating administrative documentation."
 state_university: "State University"
 state_university_desc: "There is not much room in the world for people that do not farm. But in due course there is enough of a surplus that they will find themselves without purpose in life. Why not create a university in the land to train statesmen, bureaucrats and scientists?"
 economic_prosperity: "Economic Prosperity"
 economic_prosperity_desc: "In due time the economy grows with the people. Inflation accelerates but only to keep up as there is but a finite amount of gold to be mined and minted."
