 new_institution_events.1.t: "Agricultural Revolution"
 new_institution_events.1.d: "Agricultural practices were slower to innovate in the times up to now but with new developments and the promulgation accelerating at an ever-increasing rate the population of the world is curving upward. This sees the growth of humanity to an unparalleled height."
 new_institution_events.2.a: "Excellent."
 new_institution_events.2.t: "Scholasticism"
 new_institution_events.2.d: "Scholasticism marks a sort-of departure from conventional top-down knowledge dissemination paradigms. Churches in the medieval period were often not only the arbiters of truth but they also handled inquiry. It is as such very much relevant to refine the methods of acquiring knowledge. Some terms in epistemology owe their origins to this intellectual revitalization."
 new_institution_events.3.a: "Excellent."
 new_institution_events.3.t: "Gunpowder"
 new_institution_events.3.d: "It could be described as an accidental discovery. Readily explosive, but not so destructive so as to destroy an implement from within. Instead of relying on missiles or bows, heavy-weight projectiles which are both sturdy and high in kinetic force could instead be used to great effect on the battlefield. Scale these up and one may discover cannons, useful in sieges."
 new_institution_events.4.a: "Excellent."
 new_institution_events.4.t: "Quarantine"
 new_institution_events.4.d: "Some sicknesses are either too virulent or contagious for a society to not take measures to account for. Segregating the infectious from the rest of society has been a simple yet important asset in managing public health. Be it through hospitals or makeshift institutions we will soon be better able to handle epidemics or pandemics."
 new_institution_events.5.a: "Excellent."
 new_institution_events.5.t: "Commercial Revolution"
 new_institution_events.5.d: "The world sees itself ever-changing; the major events of the past have seen as such and now is no exception. In the commercially affluent regions of the world new trading practices are being adopted. Between arabic numeration and the novel philosophy of mercantilism - a sort of commercial zero-sum game, driving a profit in international relations is now soon to be complicated, and the first to adopt may win big."
 new_institution_events.6.a: "Excellent."
 new_institution_events.6.t: "Matchlock Firearms"
 new_institution_events.6.d: "These enabled a musketeer to concentrate on his target. Before, matches had to be lit manually in a process requiring a soldier's attention. With Matchlocks armies needed instead to only pay mind to formation and aiming at the enemies' troops."
 new_institution_events.7.a: "Excellent."
 new_institution_events.7.t: "Remote Communication"
 new_institution_events.7.d: "In centuries past the fastest ways in which one could deliver a message would be expensive bureaucratic systems tailored for the purpose. Relay stations in the Mongol Empire were once equipped with horses. On their own this does not sound special but when adding all these up in some several-dozen kilometer intervals stamina of an individual animal becomes no longer relevant. Thus administrative or diplomatic communications could be handled with relative ease."
 new_institution_events.8.a: "Excellent."
 new_institution_events.8.t: "Electrification"
 new_institution_events.8.d: "Electricity can be considered by some a sort of 'physical currency' for work to be done. The reasoning for this is on the basis that electricity can be converted much easier into heat, or motion, or some other activity. Now that there are novel inventions for the generation and usage of electricity, society may soon undergo a major change that will see convenience for all."
 new_institution_events.8.a: "Excellent."

 new_institution_events.100.t: "Agricultural Revolution"
 new_institution_events.100.d: "Agricultural practices were slower to innovate in the times up to now but with new developments and the promulgation accelerating at an ever-increasing rate the population of the world is curving upward. This sees the growth of humanity to an unparalleled height."
