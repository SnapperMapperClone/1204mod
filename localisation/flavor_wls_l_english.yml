l_english:
flavor_gwy.1.t:0 "Joan of England"
flavot_gwy.1.d:0 "Joan Plantagenet, a bastard daughter of John I, was proposed to Llywelyn Fwar. Such a union could benefit by apeasing Britain's diplomatic landscape but it could create internal tensions."
flavor_gwy.1.a:0 "Let's marry her"
flavor_gwy.1.b:0 "No english swine will be princess of Wales"
prydain_or_britannia.1.t:0 "Prydain or Britannia"
prydain_or_britannia.1.d:0 "Now freed from our invaders, it is time to truly know who we are. Roman sucessors or a nation for the celts."
prydain_or_britannia.1.a:0 "Our roots are celtic"
prydain_or_britannia.1.b:0 "We remain loyal to Rome"
hadrian_wall.1.t:0 "The wall of Hadrian"
hadrian_wall.1.d:0 "Beyond that wall lies the land of the scots, friends or foes, the choice is ours."
