l_english:
#Events
flavor_wls.1.t:0 "Joan of England"
flavor_wls.1.d:0 "Joan Plantagenet, a bastard daughter of John I, was proposed to Llywelyn Fwar."
flavor_wls.1.a:0 "Let's marry her"
flavor_wls.1.b:0 "No english swine will be princess of Wales"
flavor_wls.2.t:0 "Prydain or Britannia"
flavor_wls.2.d:0 "Now freed from our invaders, it is time to truly know who we are. Roman sucessors or a nation of celts."
flavor_wls.2.a:0 "Our roots are celtic"
flavor_wls.2.b:0 "We remain loyal to Rome"
flavor_wls.3.t:0 "The wall of Hadrian"
flavor_wls.3.d:0 "Beyond that wall lies the land of the scots, friends or foes, the choice is ours."
flavor_wls.3.a:0 "The Scots were always our friends."
flavor_wls.3.b:0 "Their land is rightfully ours"

#Decisions
become_prince_of_wales_title:0 "Be crowned Prince of Wales."
become_prince_of_wales_desc:0 "With our domination over the peninsula, no one doubts our might. This title will grant us prestige and even more power."
unite_wales_title:0 "Unite Wales"
unite_wales_desc:0 "Wales can now be truly unified. England mays see us as a threat however."

#Missions
wls_unite_wales_title:0 "Unite Wales"
wls_unite_wales_desc:0 "Unite Cymru is our only chance to survive against our foe."
wls_reclaim_pengwern_title:0 "Reclaim Pengwern"
wls_reclaim_pengwern_desc:0 "The now lost kingdom of Pengwern was once the shield that guarded our peninsula. Sacked by the Anglo-saxons, reclaiming it will crush England's hegemony on the island."
wls_secure_dumnonia_title:0 "Secure Dumnonia"
wls_secure_dumnonia_desc:0 "The lands of Dumnonia are home to our cornish brothers and are rich in ore. This land is rightfully ours and is easily defendible"
wls_northumbrian_campaign_title:0 "Northumbrian Campaign"
wls_northumbrian_campaign_desc:0 "Every campaign that the people of Wales and the northumbrian led against eachother were harsh and brutal. To secure our domination over Britain we need to defeat them in a final campaign."
wls_northumbrian_campaign_tooltip:0 "This mission will give us a choice on whether we befriend the Scots or we invade them"
