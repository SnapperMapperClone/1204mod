 THE_FOURTH_CRUSADE:0 "The Fourth Crusade"
 THE_FOURTH_CRUSADE_DESC:0 "With the recent capture of Constantinople by the Latins, the peace that was in the region seems more fragile than ever. On one hand, the Latin states control the most important cities in the region, but it's safe to say it won't be so easy. On the other hand, the Roman rump states are aech preparing to take back Constantinople and reclaim the Roman throne. If that wasn't enough, they are surrounded by the slavs and the turks, both wanting to claim the lands of a dying empire for themselves. Who will be the one to come out on top?"
