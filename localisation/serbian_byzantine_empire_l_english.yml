 serbian_byz.1.a:0 "Excellent work"
 serbian_byz.2.t:0 "The Melingoi of Pelopponese"
 serbian_byz.2.d:0 "During our conquest of the Pelopponese, we have come in contact with the descendents of our fellow slavic brothers who settled there hundreads of years ago. The Romans have been calling them the Melingoi. They promise that they will be loyal to us if we allow them conrol over the peninsula and some of the surrounding areas"
 serbian_byz.2.a:0 "We will allow them to settle all over south Greece"
