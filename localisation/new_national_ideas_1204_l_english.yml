l_english:

#Great Britain 
gwy_ideas:0 "Gwyneddian ideas"
gwy_ideas_start:0 "Gwyneddian traditions"
gwy_ideas_bonus:0 "Gwyneddian ambitions"
gwy_ideas_historia_brittonum:0 "Historia Brittonum"
gwy_ideas_historia_brittonum_desc:0 "By the ninth century, Gwyneddian scholars published the Historia Brittonum, a magnificent book recording britain's history from the mythical Brutus until the princes of Wales. A text that legitimizes our authority."
gwy_ideas_first_princes_of_wales:0 "First Princes of Wales"
gwy_ideas_first_princes_of_wales_desc:0 "Before being no more but a title, the prince of Wales meant prestige and superiority over welsh petty kings as well as over the kings of England."
gwy_ideas_last_realm_standing:0 "Last Realm Standing"
gwy_ideas_last_realm_standing_desc:0 "While those southerners were defeated one by one by the dishonourable march lords, our realm stood still and strong for decades."
gwy_ideas_ore_mines:0 "Ore mines"
gwy_ideas_ore_mines_desc:0 "Our land is not fertile. But it is rich in ressources. We shall use those ressources to defeat our stronger neighbour"
gwy_ideas_llanfairpwllgwyngyllgogerychwyrndrobwllllantysiliogogogoch:0 "Llanfairpwllgwyngyllgogerychwyrndrobwllllantysiliogogogoch"
gwy_ideas_llanfairpwllgwyngyllgogerychwyrndrobwllllantysiliogogogoch_desc:0 "Our people is smart enough to use the sophisticated language that is welsh and create villages with over 50 letters."
gwy_ideas_eryri:0 "Eryri"
gwy_ideas_eryri_desc:0 "Those mountains are our strongest ally against any foreign invader. It makes us invincible."
gwy_ideas_defend_our_homeland:0  "Defend Our Homeland"
gwy_ideas_defend_our_homeland_desc:0 "We descend from the britons, who controlled that land for a thousand year. Anglo-saxons and Normands are simply foreign invaders and shall be defeated on the field."

FRA_ideas_1: "French Ideas"
banking_capital_of_europe: "Banking Capital of Europe"
banking_capital_of_europe_desc: "Lyons has established itself as the go-to for banking families looking to operate in Western Europe. With an emphasis on partitioning power with the Bourgeois of France the moneylenders of Europe can find themselves many customers, but also more competition demanding lower interest rates, if any."
diversified_textile_industries: "Diversified Textile Industries"
diversified_textile_industries_desc: "Flanders had been considered for the longest time the centerpiece of textile manufacture and processing. This however is not the entire story. Where there are imports from across the Mediterranean and Silk Road, there may also be expertise. Let's pool our resources together and make an effort to establish France as the source of choice for not only wool, but also silk and other cloths for western markets."
fund_outward_expeditions: "Fund Outward Expeditions"
fund_outward_expeditions_desc: "With a richer government at home we have surplus money to spend, and one popular choice is the expansion of the realm across other continents. The world is growing ever-interconnected and as such it's our place as the most populated country in Europe to colonize the Americas with high fervor - we simply have more people looking to carve out a piece of the world for themselves."
nationwide_naval_ordinance: "Nationwide Naval Ordinance"
nationwide_naval_ordinance_desc: "The head of state of France has taken it upon themselves to issue an ordinance requiring dockyards across the country's ports to adhere to minimum size and quality regulations. This should improve employment in the navy by diversifying the occupations to somewhat emphasize land-based jobs in maintenance and manufacture. We can employ more than anyone else in Europe."
trade_nexus: "Trade Nexus"
trade_nexus_desc: "It cannot be emphasized enough the trade route that is or could be built by expanding upon the transport infrastructure between the Rhône and Seine. Merchants from across the world would flock to Le Havre, Paris or Lyons to sell their wares to a large market and customer base."
integrated_mercenary_lessons: "Integrated Mercenary Lessons"
integrated_mercenary_lessons_desc: "Soldiers of fortune are rather common but more so in regions whose governments work to facilitate a free economy. As the preeminent economy of Europe the pool of mercenaries is larger than most and we can integrate lessons these soldiers have into our own military."
most_prestigious_royal_court: "Most Prestigious Royal Court"
most_prestigious_royal_court_desc: "French on its own possessed a reputation as a prestigious language of the European aristocracy. This is even more justified in the event Paris as well as the residence of the ruler are adorned in the most luxurious decorations, and whose furniture is most comfortable. Culture blossoms here and French is the language of the arts, but also trade and increaasingly contesting Latin for the sciences."