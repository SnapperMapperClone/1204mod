 new_fra_flavor.3.t: "Collapse of the Angevin Empire"
 new_fra_flavor.3.d: "The English were put on the backfoot with their loss of Normandy. Anjou and parts of Aquitaine were recovered, but not confirmed by, the Crown. [Root.Monarch.GetName] has found what may be the opportunity to strike again to reaffirm the cession of the Angevin continental possessions to Paris."
 new_fra_flavor.4.t: "Absolutism or Bourgeois Politics?"
 new_fra_flavor.4.d: "The Royal Politics of France lay at a crossroads. It's very much logical for the monarchy to simply amalgamate as much political capital as possible into itself but the countries to the north have experimented with a smooth integration of the successful city-dwelling elites to the politics of their countries. Perhaps France would be best to emulate."
 new_fra_flavor.4.a: "Absolutism is in our destiny."
 new_fra_flavor.4.b: "We should guarantee the rights of the Bourgeoisie."
 new_fra_flavor.5.t: "Sale of Avignon"
 new_fra_flavor.5.d: "The Papacy is isolated and vulnerable. By offering Avignon - next to France - the Pope can be guaranteed safety. This may however come at the expense that Parisian politics ultimately determines the goings-ons in the Catholic Church."
 new_fra_flavor.5.a: "Offer Avignon."
 new_fra_flavor.5.b: "We'll keep it."
 new_fra_flavor.6.a: "We will take Avignon."
 new_fra_flavor.5.b: "France keeps Avignon instead."
 
