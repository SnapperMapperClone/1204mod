 flavor_crusaders.3.t:0 "The conquest of Aleppo"
 flavor_crusaders.3.d:0 "The city of Aleppo has recently come under our control. However, our current resources make it difficult for us to directly control the lands. A Genoese trader who is interested in the area says that if we give him control of it, he will be our vassal. While not the best solution in the long term, it will allow us to stabilise our control in the area. What should we do?"
 flavor_crusaders.3.a:0 "We'll release a new crusader state as a vassal"
 flavor_crusaders.3.b:0 "We'll keep the lands for ourselves"
 flavor_crusaders.4.t:0 "Edessa reclaimed"
 flavor_crusaders.4.d:0 ""
 flavor_crusaders.4.a:0 "Deus Vult!"
 flavor_crusaders.5.t:0 "Greek catholic refugees"
 flavor_crusaders.5.d:0 "After the fall of the Latin Empire of Constantinople and the reconquest of Greece by the Romans, many Greek catholics feared they will be persecuted by the Eastern Orthodox church, and so they left their homelands. The proximity of the crusader states provides a possible sanctuary, plus the lack of Christians in our border areas is a perfect opportunity to give us more strength to control the area better"
 flavor_crusaders.5.a:0 "Let them settle in our northern border"

